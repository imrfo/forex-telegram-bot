name: Forex News Bot

on:
  schedule:
    # اجرای خودکار هر ۱۵ دقیقه یک‌بار در تمام طول شبانه‌روز
    - cron: '*/15 * * * *'
  workflow_dispatch: # امکان اجرای دستی در صورت نیاز

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install google-genai requests feedparser

      - name: Run bot script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py

      - name: Save seen history and ticker
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          touch seen_ids.txt
          touch ticker.json
          git add seen_ids.txt ticker.json
          git diff --staged --quiet || (git commit -m "Update seen news and ticker [skip ci]" && git push)
